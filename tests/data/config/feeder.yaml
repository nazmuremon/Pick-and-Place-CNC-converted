# FROZEN TEST COPY of config/feeder.yaml, taken 2026-10-12. Only the tests read it (tests/conftest.py copies it to
# a temporary folder for every test run). Never update it from the calibration tools or by copying the live
# file again: change a value here only together with the test that needs it.
# Written by the pick and place page (ui/app.py): what is in each slot (D11, D17), the board side
# for the job, and the package data (from feeder.example.yaml). Edit the packages here if needed.
