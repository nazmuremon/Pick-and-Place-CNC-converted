  "SMA": {kind: diode, body: [4.3, 2.6], height: 2.4, pads: 2, polar: true, pickable: yes,
          tape: {width: 12, pitch: 4}, tape_angle: null, nozzle: null,
          aliases: [DO-214AC], patterns: ["(^|_)SMA($|_)", "DO-?214AC"]}
  "SMB": {kind: diode, body: [4.3, 3.6], height: 2.4, pads: 2, polar: true, pickable: yes,
