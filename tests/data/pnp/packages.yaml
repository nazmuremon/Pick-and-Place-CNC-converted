# FROZEN TEST COPY of config/packages.yaml, taken 2026-10-12 for the v2 tests (tests/v2/).
# Never update it from the program: the tests expect these values.
# Package library (docs/13 §4.4), shipped with the program. Your own additions go in packages.user.yaml (read
# first, so it can also change an entry here).
#
# Sizes are NOMINAL values from the package standards (EIA chip sizes, JEDEC outlines) and typical datasheets, not
# measured on this machine. height = the tallest usual part in mm (capacitors are thicker than resistors).
# A footprint name is matched in this order: an alias (exact, any case), a pattern (regular expression), the
# metric chip code (2012Metric -> 0805), the LCSC / EasyEDA name style (SOT-23-6_L2.9-W1.6-...).
#
#   kind:      chip | diode | transistor | ic | crystal | switch | inductor | other
#   body:      [length, width] mm (the long side first)
#   pads:      number of pads
#   polar:     true when the orientation matters (a 180° turn is wrong)
#   pickable:  yes | bottom_camera (needs the part's angle on the nozzle) | by_hand  (yes = true in YAML: both work)
#   tape:      EIA-481 carrier tape: width and pocket pitch, mm
#   tape_angle: the part's angle in the pocket (library zero = 0°) in the slot frame (tape along +X). null = TBD:
#              measured on the first part of a strip (docs/13 §4.4). Chips lie across the tape: 90.
#   nozzle:    a nozzle id of the profile, or null (any)
schema_version: 1
packages:
  "0201": {kind: chip, body: [0.6, 0.3], height: 0.3, pads: 2, polar: false, pickable: by_hand,
           tape: {width: 8, pitch: 2}, tape_angle: 90, nozzle: null}     # too small for the needles we have
  "0402": {kind: chip, body: [1.0, 0.5], height: 0.55, pads: 2, polar: false, pickable: yes,
           tape: {width: 8, pitch: 2}, tape_angle: 90, nozzle: null}
  "0603": {kind: chip, body: [1.6, 0.8], height: 0.9, pads: 2, polar: false, pickable: yes,
           tape: {width: 8, pitch: 4}, tape_angle: 90, nozzle: null}
  "0805": {kind: chip, body: [2.0, 1.25], height: 1.35, pads: 2, polar: false, pickable: yes,
           tape: {width: 8, pitch: 4}, tape_angle: 90, nozzle: null}
  "1206": {kind: chip, body: [3.2, 1.6], height: 1.8, pads: 2, polar: false, pickable: yes,
           tape: {width: 8, pitch: 4}, tape_angle: 90, nozzle: null}
  "1210": {kind: chip, body: [3.2, 2.5], height: 2.5, pads: 2, polar: false, pickable: yes,
           tape: {width: 8, pitch: 4}, tape_angle: 90, nozzle: null}
  "1812": {kind: chip, body: [4.5, 3.2], height: 2.5, pads: 2, polar: false, pickable: yes,
           tape: {width: 12, pitch: 8}, tape_angle: 90, nozzle: null}
  "2010": {kind: chip, body: [5.0, 2.5], height: 0.7, pads: 2, polar: false, pickable: yes,
           tape: {width: 12, pitch: 4}, tape_angle: 90, nozzle: null}
  "2512": {kind: chip, body: [6.3, 3.2], height: 0.7, pads: 2, polar: false, pickable: yes,
           tape: {width: 12, pitch: 4}, tape_angle: 90, nozzle: null}
  "SOD-123": {kind: diode, body: [2.7, 1.6], height: 1.35, pads: 2, polar: true, pickable: yes,
              tape: {width: 8, pitch: 4}, tape_angle: null, nozzle: null, patterns: ["SOD-?123(?!F)"]}
  "SOD-123F": {kind: diode, body: [2.7, 1.6], height: 1.1, pads: 2, polar: true, pickable: yes,
               tape: {width: 8, pitch: 4}, tape_angle: null, nozzle: null, patterns: ["SOD-?123F"]}
  "SOD-323": {kind: diode, body: [1.7, 1.25], height: 1.1, pads: 2, polar: true, pickable: yes,
